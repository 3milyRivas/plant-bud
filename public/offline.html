<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#113e14" />
    <title>Plant Bud is offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background:
          radial-gradient(circle at top, rgba(235, 227, 167, 0.24), transparent 38rem), #416543;
        color: #113e14;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100dvh;
        padding: 1.25rem;
      }

      main {
        background: #f9f6df;
        border: 1px solid rgba(255, 255, 255, 0.65);
        border-radius: 2rem;
        box-shadow: 0 1.5rem 4rem rgba(7, 27, 9, 0.28);
        max-width: 28rem;
        padding: 2rem;
        text-align: center;
        width: 100%;
      }

      img {
        height: 6rem;
        width: 6rem;
      }

      h1 {
        font-size: clamp(2rem, 9vw, 3rem);
        line-height: 0.95;
        margin: 1.25rem 0 0.75rem;
      }

      p {
        color: #416543;
        font-size: 1rem;
        font-weight: 650;
        line-height: 1.55;
        margin: 0;
      }

      button {
        background: #113e14;
        border: 0;
        border-radius: 999px;
        color: #ebe3a7;
        cursor: pointer;
        font: inherit;
        font-weight: 800;
        margin-top: 1.5rem;
        min-height: 3rem;
        padding: 0.75rem 1.5rem;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>Keep growing.</h1>
      <p>Plant Bud cannot reach the network right now. Reconnect and try again.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
